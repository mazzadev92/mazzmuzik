name: Build iOS IPA (Unsigned for Sideloading)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: apps/mazzmuzik-ios
        run: flutter pub get

      - name: Build unsigned iOS IPA
        working-directory: apps/mazzmuzik-ios
        run: flutter build ipa --no-codesign

      - name: Package Payload to .ipa
        working-directory: apps/mazzmuzik-ios/build/ios/archive
        run: |
          mkdir -p Payload
          cp -r Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r MazzMuZik-unsigned.ipa Payload
          mv MazzMuZik-unsigned.ipa ../../../

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MazzMuZik-unsigned-ipa
          path: apps/mazzmuzik-ios/MazzMuZik-unsigned.ipa
          retention-days: 14
